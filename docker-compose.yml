version: '3.8'
services:
  postgres:
    image: postgres:14
    container_name: psi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: psi_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
